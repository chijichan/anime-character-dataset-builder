[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-character-dataset-builder"
version = "0.1.0"
description = "Build an anime character classification dataset from raw video: frames -> detection -> crops -> dedup -> quality -> embedding -> clustering -> labels -> splits -> ImageFolder export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ACDB contributors" }]
keywords = ["anime", "dataset", "detection", "clustering", "metric-learning", "imagefolder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# ---- Core runtime (CPU-only path, no model downloads required) -------------
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.2",
    "imagehash>=4.3",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
# Deep-learning backends. Install only what you need; the pipeline degrades
# gracefully to the classical CV implementations when they are absent.
torch = ["torch>=2.1", "torchvision>=0.16", "timm>=0.9"]
yolo = ["ultralytics>=8.1"]
onnx = ["onnxruntime>=1.17"]
video = ["av>=12.0", "scenedetect>=0.6.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "ultralytics>=8.1",
    "onnxruntime>=1.17",
    "av>=12.0",
    "scenedetect>=0.6.4",
]

[project.scripts]
acdb = "acdb.cli:main"

[project.urls]
Homepage = "https://example.invalid/anime-character-dataset-builder"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acdb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises the whole pipeline on a rendered video (a few seconds)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    # The codebase targets Python 3.10+ and deliberately keeps typing.Optional /
    # typing.List in signatures: they read better in long nested annotations and
    # stay valid at runtime for the dataclass introspection in acdb.config.
    "UP006", "UP007", "UP035", "UP045",
    # zip(strict=) is a style preference, not a correctness rule here.
    "B905",
    # Abstract base classes intentionally provide no-op hooks.
    "B027",
    # Nested `if`/`with` are kept where the nesting documents the guard order.
    "SIM102", "SIM117",
]
